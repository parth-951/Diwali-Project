# Publishes a GitHub Release when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The release gets the .deb and .tar.gz binary packages and a source tarball.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the project version
        run: |
          version=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          cd build
          cpack
          cpack --config CPackSourceConfig.cmake

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/*.deb
            build/*.tar.gz
